name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Services Java
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: Compiler et tester
        run: ./mvnw -B verify

  web:
    name: Tableau de bord Angular
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relais-web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: relais-web/package-lock.json
      - name: Installer les dépendances
        run: npm ci
      - name: Compiler
        run: npm run build
      - name: Tester
        run: npm test -- --watch=false
